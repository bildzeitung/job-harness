[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scoring-module"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["scoring_module"]
