[project]
name = "harness-db"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pyyaml>=6",
    "typer>=0.12",
    # Semantic dedup / similarity is a first-class part of the harness. Requires an
    # extension-capable Python build (sqlite3 with --enable-loadable-sqlite-extensions)
    # and a local Ollama serving the embedding model (`ollama pull qwen3-embedding:0.6b`).
    "sqlite-vec>=0.1.6",
    "ollama>=0.3",
    "numpy>=1.26",
]

[project.scripts]
harness-db = "harness_db.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["harness_db"]

[tool.hatch.build.targets.wheel.force-include]
"harness_db/disqualifiers.default.yaml" = "harness_db/disqualifiers.default.yaml"
"harness_db/target-roles.default.md" = "harness_db/target-roles.default.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "nox>=2024.3.2", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
lint.extend-select = ["I"]
