[project]
name = "harness-db"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pyyaml>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["harness_db"]

[tool.hatch.build.targets.wheel.force-include]
"harness_db/disqualifiers.default.yaml" = "harness_db/disqualifiers.default.yaml"

[project.optional-dependencies]
dev = ["pytest>=8.0", "nox>=2024.3.2", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
lint.extend-select = ["I"]
