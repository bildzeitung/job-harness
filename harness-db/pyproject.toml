[project]
name = "harness-db"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["harness_db"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "nox>=2024.3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
lint.extend-select = ["I"]
