[project]
name = "job-tui"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "sqlalchemy>=2.0",
    "typer>=0.12",
]

[project.scripts]
job-tui = "tui.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["tui"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
