[project]
name = "job-tui"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "harness-db",
]

[project.scripts]
job-tui = "tui.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["tui"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "nox>=2024.3.2", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
lint.extend-select = ["I"]
