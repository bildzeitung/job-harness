[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "email-parser"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "nox>=2024.3.2", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["email_parser"]

[tool.ruff]
line-length = 100
lint.extend-select = ["I"]
