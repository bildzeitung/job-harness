[project]
name = "job-web"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "reflex>=0.9",
    "httpx>=0.27",
    "harness-db",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "nox>=2024.3.2", "ruff>=0.6"]
# Deps for the standalone agent-runner service (Docker `agent-runner` image only).
runner = ["fastapi>=0.110", "uvicorn>=0.30"]

[tool.hatch.build.targets.wheel]
packages = ["web"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
lint.extend-select = ["I"]
