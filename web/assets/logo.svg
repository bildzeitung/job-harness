<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Job Harness — cheerful goose">
  <!-- Job Harness logo: a happy cartoon goose, as a circular patch with wordmark. -->
  <defs>
    <clipPath id="badge"><circle cx="128" cy="128" r="124"/></clipPath>
    <!-- Bottom arc for the curved wordmark (left -> right through the bottom). -->
    <path id="wordmark-arc" d="M 44,182 A 102,102 0 0 0 212,182"/>
  </defs>

  <!-- Sky badge with patch rings -->
  <g clip-path="url(#badge)">
    <rect x="0" y="0" width="256" height="256" fill="#BFE6F2"/>
  </g>
  <circle cx="128" cy="128" r="124" fill="none" stroke="#2B2B2B" stroke-width="6"/>
  <circle cx="128" cy="128" r="115" fill="none" stroke="#2B2B2B" stroke-width="2" opacity="0.5"/>

  <!-- Cheerful sparkles -->
  <g fill="#FFD24A" stroke="#2B2B2B" stroke-width="1.5" stroke-linejoin="round">
    <path d="M 196,58 l 4,9 9,4 -9,4 -4,9 -4,-9 -9,-4 9,-4 z"/>
    <path d="M 58,96 l 3,7 7,3 -7,3 -3,7 -3,-7 -7,-3 7,-3 z"/>
  </g>

  <!-- Tuft / cowlick -->
  <path d="M 122,34 C 120,22 132,20 134,30" fill="none" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"/>

  <!-- Webbed feet -->
  <g fill="#F6A623" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round">
    <path d="M 108,150 L 124,150 L 120,168 L 116,162 L 112,168 Z"/>
    <path d="M 132,150 L 148,150 L 144,168 L 140,162 L 136,168 Z"/>
  </g>

  <!-- Goose silhouette: round head + plump body (single outline) -->
  <path d="M 128,33
           C 145,33 160,46 160,64
           C 160,80 152,90 146,98
           C 168,104 178,120 176,134
           C 174,150 156,162 128,162
           C 100,162 82,150 80,134
           C 78,120 88,104 110,98
           C 104,90 96,80 96,64
           C 96,46 111,33 128,33 Z"
        fill="#FFFFFF" stroke="#2B2B2B" stroke-width="6" stroke-linejoin="round"/>

  <!-- Wings (folded, with one feather line each) -->
  <g fill="#FFFFFF" stroke="#2B2B2B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 96,108 C 80,116 76,138 90,152 C 94,138 96,122 96,108 Z"/>
    <path d="M 160,108 C 176,116 180,138 166,152 C 162,138 160,122 160,108 Z"/>
  </g>
  <g fill="none" stroke="#2B2B2B" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
    <path d="M 90,120 C 86,130 86,140 92,148"/>
    <path d="M 166,120 C 170,130 170,140 164,148"/>
  </g>

  <!-- Blush -->
  <circle cx="103" cy="82" r="7" fill="#F7B6B6" opacity="0.75"/>
  <circle cx="153" cy="82" r="7" fill="#F7B6B6" opacity="0.75"/>

  <!-- Happy closed eyes (^ ^) -->
  <g fill="none" stroke="#2B2B2B" stroke-width="4.5" stroke-linecap="round">
    <path d="M 105,64 Q 114,54 123,64"/>
    <path d="M 133,64 Q 142,54 151,64"/>
  </g>

  <!-- Beak -->
  <ellipse cx="128" cy="76" rx="11" ry="7" fill="#F6A623" stroke="#2B2B2B" stroke-width="4"/>

  <!-- Grin -->
  <path d="M 116,88 Q 128,99 140,88" fill="none" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"/>

  <!-- Curved wordmark -->
  <text font-family="'DejaVu Sans','Verdana',sans-serif" font-size="23" font-weight="700"
        letter-spacing="2" fill="#2B2B2B">
    <textPath href="#wordmark-arc" startOffset="50%" text-anchor="middle">JOB HARNESS</textPath>
  </text>
</svg>
