# Per-source search data. Packaged default — edit in the repo to tune.
#
# adzuna     : keyword search driven by candidate-summary target_titles.
# greenhouse : Greenhouse public board API, one board per slug.
# lever      : Lever public postings API, one board per slug.
# ashby      : Ashby public board API, one board per slug (the jobs.ashbyhq.com/{slug} id).
# workable   : Workable public widget API, one board per slug (the {slug}.workable.com id).
# recruitee  : Recruitee public offers API, one board per slug (the {slug}.recruitee.com id).
# remotive   : Remotive remote-jobs API, keyword search driven by target_titles.
# himalayas  : Himalayas remote-jobs API, latest `limit` postings, Canada-eligible only.
# wwr        : We Work Remotely RSS feeds, one per category, Canada-eligible only.

adzuna:
  results_per_page: 50
  full_time: 1
  # Seconds between serialized queries — the free tier 429s under parallel fan-out.
  request_delay: 1.5

# Slugs are validated periodically — companies migrate ATS often, and a dead
# board only emits a 404 error and zero results. When a board 404s, hunt its new
# home (commonly Ashby) rather than just deleting it. Last verified 2026-06-07.
greenhouse:
  slugs:
    - stripe
    - datadog
    - mongodb
    - elastic
    - cloudflare
    - fastly
    - vercel
    - temporal
    - planetscale
    - cockroachlabs
    - samsara
    - brex
    - figma
    - airtable
    - doximity
    - flatironhealth
    - d2l
    - unity3d
    - hootsuite
    - asana
    - carta
    - gusto
    - intercom
    - hubspotjobs
    - dremio
    - dbtlabsinc
    - scaleai
    - starburst

lever:
  slugs:
    - plaid
    - wealthsimple
    - veeva

# Ashby slugs are the board id in jobs.ashbyhq.com/{slug}. Verified to return
# postings; companies already covered by the greenhouse/lever lists are left out
# to avoid cross-platform double-listing.
ashby:
  slugs:
    - linear
    - posthog
    - vanta
    - replit
    - deel
    - runway
    - watershed
    - supabase
    - render
    - openai
    - airbyte
    - confluent
    - ramp
    - notion
    - benchling
    - 1password
    - lightspeed
    - cohere
    - prefect
    - healthgorilla

# Workable slugs are the {slug}.workable.com board id. These ATSes skew toward
# EU/SMB companies, so the seed list is short and verified — extend it with
# boards relevant to your own search.
workable:
  slugs:
    - zego
    - doist

# Recruitee slugs are the {slug}.recruitee.com board id. Same EU/SMB skew —
# extend with boards relevant to your search.
recruitee:
  slugs:
    - personio
    - nmbrs
    - channable

remotive:
  # Max results per target-title query (Remotive caps at the board size).
  limit: 50

himalayas:
  # Number of 20-posting pages to page through the recency-ordered feed (the
  # public endpoint caps each request at 20). Canada-eligible senior roles are
  # sparse in any window, so scan a few hundred postings.
  pages: 15

wwr:
  # We Work Remotely RSS category slugs (weworkremotely.com/categories/{slug}.rss).
  categories:
    - remote-programming-jobs
    - remote-full-stack-programming-jobs
    - remote-back-end-programming-jobs
    - remote-devops-sysadmin-jobs
