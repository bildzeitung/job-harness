[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api-search"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "nox>=2024.3.2", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["api_search"]

[tool.hatch.build.targets.wheel.force-include]
"api_search/sources_default.yaml" = "api_search/sources_default.yaml"

[tool.ruff]
line-length = 100
lint.extend-select = ["I"]
